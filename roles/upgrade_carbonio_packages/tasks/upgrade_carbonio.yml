---
- name: Update repositories cache [Ubuntu]
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - upgrade-carbonio

- name: Get packages to upgrade [Ubuntu]
  become: true
  ansible.builtin.shell:
    cmd: 'set -o pipefail && apt list --upgradable 2>/dev/null | cut -f 1 -d / | tail -n +2'
    executable: /bin/bash
  register: pkgu
  changed_when: false
  when: ansible_facts.os_family == "Debian"
  tags:
    - upgrade-carbonio

- name: Get packages to upgrade [RHEL]
  become: true
  ansible.builtin.shell:
    cmd: "set -o pipefail && yum check-update -y 2>/dev/null | awk '/zextras/ {print $1}'"
    executable: /bin/bash
  register: pkgr
  changed_when: false
  failed_when: pkgr.rc not in [0, 100]
  when: ansible_facts.os_family == "RedHat"
  tags:
    - upgrade-carbonio

# Initialize the restart flag for the current upgrade run
- name: Initialize restart flag
  ansible.builtin.copy:
    dest: "{{ restart_file }}"
    content: |
      true
  tags:
    - track-zmcontrol

- name: Display packages to upgrade [Ubuntu]
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.debug:
    msg: "{{ pkgu }}"

- name: Display packages to upgrade [RHEL]
  when: ansible_facts.os_family == "RedHat"
  ansible.builtin.debug:
    msg: "{{ pkgr }}"

###Temporary workaround to upgrade from Carbonio 25.12.0
- name: Remove old Message Dispatcher dpkg-dist configuration [Ubuntu]
  become: true
  ansible.builtin.file:
    path: /etc/carbonio/message-dispatcher/mongooseim.toml.dpkg-dist
    state: absent
  when:
    - ansible_facts.os_family == "Debian"
    - groups['workStreamServers'] | length > 0
    - inventory_hostname == groups['workStreamServers'][0]
    - pkgu is search("carbonio-message-dispatcher")
  tags:
    - upgrade-carbonio

- name: Upgrade Carbonio Message Dispatcher with new configuration [Ubuntu]
  become: true
  ansible.builtin.apt:
    name: carbonio-message-dispatcher
    state: latest
    only_upgrade: true
    dpkg_options: force-confnew
  when:
    - ansible_facts.os_family == "Debian"
    - groups['workStreamServers'] | length > 0
    - inventory_hostname == groups['workStreamServers'][0]
    - pkgu is search("carbonio-message-dispatcher")
  tags:
    - upgrade-carbonio

- name: Remove old Message Dispatcher rpmnew configuration [RHEL]
  become: true
  ansible.builtin.file:
    path: /etc/carbonio/message-dispatcher/mongooseim.toml.rpmnew
    state: absent
  when:
    - ansible_facts.os_family == "RedHat"
    - groups['workStreamServers'] | length > 0
    - inventory_hostname == groups['workStreamServers'][0]
    - pkgr is search("carbonio-message-dispatcher")

- name: Upgrade Carbonio Message Dispatcher [RHEL]
  become: true
  ansible.builtin.yum:
    name: carbonio-message-dispatcher
    state: latest
    allowerasing: true
  when:
    - ansible_facts.os_family == "RedHat"
    - groups['workStreamServers'] | length > 0
    - inventory_hostname == groups['workStreamServers'][0]
    - pkgr is search("carbonio-message-dispatcher")

- name: Check new Message Dispatcher configuration [RHEL]
  become: true
  ansible.builtin.stat:
    path: /etc/carbonio/message-dispatcher/mongooseim.toml.rpmnew
  register: message_dispatcher_rpmnew
  when:
    - ansible_facts.os_family == "RedHat"
    - groups['workStreamServers'] | length > 0
    - inventory_hostname == groups['workStreamServers'][0]
    - pkgr is search("carbonio-message-dispatcher")

- name: Apply new Message Dispatcher configuration [RHEL]
  become: true
  ansible.builtin.copy:
    src: /etc/carbonio/message-dispatcher/mongooseim.toml.rpmnew
    dest: /etc/carbonio/message-dispatcher/mongooseim.toml
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when:
    - message_dispatcher_rpmnew is defined
    - message_dispatcher_rpmnew.stat.exists | default(false)

- name: Remove Message Dispatcher rpmnew configuration [RHEL]
  become: true
  ansible.builtin.file:
    path: /etc/carbonio/message-dispatcher/mongooseim.toml.rpmnew
    state: absent
  when:
    - message_dispatcher_rpmnew is defined
    - message_dispatcher_rpmnew.stat.exists | default(false)
###

- name: Update all packages to their latest version [Ubuntu]
  become: true
  ansible.builtin.apt:
    upgrade: full
  when: ansible_facts.os_family == "Debian"

- name: Upgrade all packages [RHEL]
  become: true
  ansible.builtin.yum:
    name: "*"
    state: latest
    allowerasing: true
  register: update
  when: ansible_facts.os_family == "RedHat"

- name: Restart Directory Server
  become: true
  become_method: su
  become_user: zextras
  ansible.builtin.command: /opt/zextras/bin/zmcontrol restart
  register: zm_status
  changed_when: zm_status.rc == 0
  when: 
    - inventory_hostname in groups['masterDirectoryServers'] or inventory_hostname in groups['replicaDirectoryServers']
    - ansible_facts.distribution_major_version != "9"
    - ansible_facts.distribution_major_version != "24"
    - pkgu is search("carbonio-directory-server") or pkgr is search("carbonio-directory-server")
  tags:
    - upgrade-carbonio

- name: Restart Carbonio services [Ubuntu 24/RHEL 9]
  become: true
  ansible.builtin.systemd_service:
    name: carbonio.target
    state: restarted
  when: 
    - inventory_hostname in groups['masterDirectoryServers'] or inventory_hostname in groups['replicaDirectoryServers']
    - ansible_facts.distribution_major_version == "9" or ansible_facts.distribution_major_version == "24"
    - pkgu is search("carbonio-directory-server") or pkgr is search("carbonio-directory-server")
  tags:
    - upgrade-carbonio
    
# set content for restart file to false. Only for LDAP master and LDAP replica
- name: Reset restart flag
  ansible.builtin.copy:
    dest: "{{ restart_file }}"
    content: |
      false
  when: inventory_hostname in groups['masterDirectoryServers'] or inventory_hostname in groups['replicaDirectoryServers']
  tags:
    - track-zmcontrol