---
  - name: Install Memcached on [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ memcached_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname == groups['proxyServers'][0]
    tags:
      - install-carbonio-memcached

######## RHEL
  - name: Install Memcached on [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ memcached_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat" 
      - inventory_hostname == groups['proxyServers'][0]
    tags:
      - install-carbonio-memcached