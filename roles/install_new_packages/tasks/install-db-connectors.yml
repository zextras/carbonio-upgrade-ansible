---
- name: Install notification push db connector [Ubuntu]
  become: true
  ansible.builtin.apt: name={{ item }} state=present
  with_items:
    - "{{ notification_push_dbconnectors_packages }}"
  when:
    - ansible_facts.os_family == "Debian"
    - (
        (inventory_hostname == groups['postgresServers'][0] and groups['dbsConnectorServers'] | length == 0) or
        (groups['dbsConnectorServers'] | length > 0 and inventory_hostname in groups['dbsConnectorServers'] and groups['dbsConnectorServers'][0] != groups['postgresServers'][0])
      )
    - groups['workStreamServers'] | length > 0
  tags:
    - install-carbonio-dbconnectors
    - install-carbonio-notification-push

- name: Install videorecorder db connector [Ubuntu]
