---
- name: Disable memcached service on additional proxy servers
  become: true
  become_method: su
  become_user: zextras
  ansible.builtin.command: /opt/zextras/bin/carbonio prov -l ms {{ inventory_hostname }} -zimbraServiceEnabled memcached -zimbraServiceInstalled memcached
  when: 
    - groups['proxyServers'] | length > 1
    - inventory_hostname in groups['proxyServers']
    - inventory_hostname != groups['proxyServers'][0]
  tags:
    - fix-config

- name: Configure AVDB updater for multi-mailbox deployments
  become: true
  ansible.builtin.template:
    src: avdb-updater-config.properties.j2
    dest: /opt/zextras/conf/avdb-updater-config.properties
    owner: zextras
    group: zextras
    mode: '0644'
  when:
    - inventory_hostname in groups['proxyServers']
    - groups['applicationServers'] | length > 1
  notify: restart_avdb_updater
  tags:
    - fix-config