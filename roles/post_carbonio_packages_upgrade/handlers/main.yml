---
# handlers file for post_carbonio_packages_upgrade
- name: restart_carbonio_services
  become: true
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ carbonio_services_in_memory.stdout_lines }}"