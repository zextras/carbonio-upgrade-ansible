---
  - name: Install Carbonio Proxy an UIs [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ proxy_packages }}"        
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups['proxyServers'] 
    tags:
      - install-carbonio-proxy 
  
  - name: Install Carbonio storage UI [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ storage_ui_packages }}"        
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups['proxyServers']
      - groups['filesServers'] | length > 0 
    tags:
      - install-carbonio-proxy

######## RHEL
  - name: Install Carbonio Proxy an UIs [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ proxy_packages }}"        
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups['proxyServers'] 
    tags:
      - install-carbonio-proxy  

  - name: Install Carbonio storage UI [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ storage_ui_packages }}"        
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups['proxyServers']
      - groups['filesServers'] | length > 0
    tags:
      - install-carbonio-proxy    