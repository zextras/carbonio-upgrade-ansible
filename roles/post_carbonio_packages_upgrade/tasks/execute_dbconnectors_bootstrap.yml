---

### Ubuntu 
- name: Check if Patroni is installed [Ubuntu]
  become: true
  ansible.builtin.shell: apt list --installed 2>/dev/null | grep -w '^patroni'
  register: patroni_check_debian
  failed_when: false
  changed_when: false 
  when: ansible_facts.os_family == "Debian"
  delegate_to: "{{ groups['postgresServers'][0] }}"
  tags:
    - install-carbonio-dbconnectors

# If Patroni is installed (HA)
- name: Manage Postgres password [Ubuntu] (HA)
  ansible.builtin.set_fact:
      carbonio_postgres_password: "{{ lookup('ansible.builtin.password', inventory_file + '_postgrespassword', chars=['ascii_letters']) }}"
  when: 
    - ansible_facts.os_family == "Debian"
    - groups['dbsConnectorServers'] | length > 0
    - inventory_hostname == groups['dbsConnectorServers'][0] 
    - "'patroni' in patroni_check_debian.stdout"
  tags:
      - db-connectors-bootstrap


- name: Run mailbox db-connectors Bootstrap [Ubuntu] (HA)
  environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
  ansible.builtin.command: /usr/bin/carbonio-mailbox-db-bootstrap carbonio_adm 127.0.0.1
  become: true
  when: 
    - ansible_facts.os_family == "Debian"
    - groups['dbsConnectorServers'] | length > 0
    - inventory_hostname == groups['dbsConnectorServers'][0] 
    - "'patroni' in patroni_check_debian.stdout"
  tags:
      - db-connectors-bootstrap

