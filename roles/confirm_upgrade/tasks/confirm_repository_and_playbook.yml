---
- name: Prompt for repository and playbook confirmation
  ansible.builtin.pause:
    prompt: |
      ============================================================
      CARBONIO UPGRADE CONFIRMATION
      ============================================================

      Upgrade playbook source:
        {{ hostvars['localhost'].carbonio_playbook_source }}

      Upgrade playbook version:
        {{ hostvars['localhost'].carbonio_playbook_version }}

      Zextras repository:
        {{ hostvars['localhost'].carbonio_repositories | first }}

      Verify that the repository and upgrade playbook version
      are correct for the Carbonio version you intend to upgrade to.

      ============================================================
      Type 'yes' and press ENTER to continue:
  register: carbonio_repository_and_playbook_confirmation
  run_once: true
  when: carbonio_auto_confirm_repository_and_playbook is not defined or not (carbonio_auto_confirm_repository_and_playbook | bool)

- name: Display Carbonio repository and playbook information
  ansible.builtin.pause:
    seconds: 5
    prompt: |
      ============================================================
      CARBONIO UPGRADE CONFIRMATION
      ============================================================

      Upgrade playbook source:
        {{ hostvars['localhost'].carbonio_playbook_source }}

      Upgrade playbook version:
        {{ hostvars['localhost'].carbonio_playbook_version }}

      Zextras repository:
        {{ hostvars['localhost'].carbonio_repositories | first }}

      Automatic repository and playbook confirmation is enabled.
      ============================================================
  run_once: true
  when:
    - carbonio_auto_confirm_repository_and_playbook is defined
    - carbonio_auto_confirm_repository_and_playbook | bool

- name: Set automatic repository and playbook confirmation
  ansible.builtin.set_fact:
    carbonio_repository_and_playbook_confirmation:
      user_input: 'YES'
  run_once: true
  when:
    - carbonio_auto_confirm_repository_and_playbook is defined
    - carbonio_auto_confirm_repository_and_playbook | bool

- name: Abort upgrade when repository and playbook are not confirmed
  ansible.builtin.fail:
    msg: >-
      Upgrade aborted. Verify that the configured Carbonio
      repository and upgrade playbook version are correct
      before continuing.
  run_once: true
  when: (carbonio_repository_and_playbook_confirmation.user_input | default('') | upper) != 'YES'